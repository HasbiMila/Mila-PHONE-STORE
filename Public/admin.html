<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • MILA PHONE STORE</title><link rel="stylesheet" href="/styles.css"></head>
<body class="adminBody">
<div id="login" class="login"><div class="loginCard"><div class="brand">MILA<span>PHONE</span></div><h1>Admin Dashboard</h1><p>Kelola produk, stok, pesanan, dan pengaturan toko.</p><input id="email" value="admin@milaphone.store" placeholder="Email"><input id="password" type="password" placeholder="Password"><button class="btn primary full" onclick="login()">Masuk</button><small>Gunakan kredensial dari environment server Anda.</small></div></div>
<div id="dashboard" class="dash hidden"><aside><div class="brand">MILA<span>PHONE</span></div><button onclick="showTab('overview')">Overview</button><button onclick="showTab('products')">Produk</button><button onclick="showTab('orders')">Pesanan</button><button onclick="showTab('settings')">Pengaturan</button><a href="/">← Toko</a><button onclick="logout()">Keluar</button></aside><section class="dashMain"><div class="dashTop"><div><div class="eyebrow">ADMIN</div><h1 id="tabTitle">Overview</h1></div><button class="btn ghost" onclick="refresh()">Refresh</button></div><div id="content"></div></section></div>
<div id="productModal" class="modal"><div class="sheet"><button class="close" onclick="closeProduct()">×</button><h2 id="formTitle">Tambah Produk</h2><form id="productForm" onsubmit="saveProduct(event)"><input name="name" placeholder="Nama produk" required><input name="brand" placeholder="Brand" required><input name="sku" placeholder="SKU" required><div class="two"><input name="price" type="number" placeholder="Harga" required><input name="sale_price" type="number" placeholder="Harga promo"></div><div class="two"><input name="stock" type="number" placeholder="Stok" required><input name="discount" type="number" placeholder="Diskon %"></div><div class="two"><input name="ram" placeholder="RAM"><input name="storage" placeholder="Storage"></div><input name="colors" placeholder="Warna, pisahkan koma"><input name="image" placeholder="URL gambar (atau upload di bawah)"><input id="photo" type="file" accept="image/png,image/jpeg,image/webp"><textarea name="description" placeholder="Deskripsi"></textarea><input name="specs" placeholder="Spesifikasi, pisahkan dengan |"><button class="btn primary full">Simpan Produk</button></form></div></div>
<script src="/admin.js"></script></body></html>
